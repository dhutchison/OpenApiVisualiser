<div class="container">
  <header class="header">
    <div id="masthead"></div>
    <div class="header-copy">
      <p class="eyebrow">OpenAPI diagram explorer</p>
      <h1 class="title">
        {{ title }}
      </h1>

      <p>A utility for visualising the paths of an OpenAPI definition</p>
    </div>
    <button
      type="button"
      class="app-button app-button--secondary theme-toggle"
      [attr.aria-pressed]="darkMode"
      (click)="toggleDarkMode()">
      @if (darkMode) {
        <svg lucideSun class="app-icon" aria-hidden="true" focusable="false"></svg>
        <span>Light</span>
      } @else {
        <svg lucideMoon class="app-icon" aria-hidden="true" focusable="false"></svg>
        <span>Dark</span>
      }
    </button>
  </header>


  <router-outlet></router-outlet>

</div>
