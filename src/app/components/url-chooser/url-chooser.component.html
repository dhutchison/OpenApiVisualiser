
<p-dialog header="Import from URL" [(visible)]="display" [modal]="true"
  [style]="{width: 'min(42rem, 92vw)'}"
  [contentStyle]="{overflow: 'visible'}"
  class="url-import-dialog"
  [minY]="70">
      <div class="url-import-dialog__body">
        <div class="url-import-dialog__field-row">
          <label class="url-import-dialog__label" for="url-input">URL</label>
          <div class="url-import-dialog__input-wrap">
            <input
              class="url-import-dialog__input"
              id="url-input"
              type="url"
              name="url"
              [(ngModel)]="url"
              pInputText
              required>
          </div>
        </div>
      </div>
      <ng-template #footer>
          <div class="url-import-dialog__footer">
            <button type="submit" class="app-button app-button--primary"
              [disabled]="!(url && url.length > 0)"
              (click)="import()">
              <svg lucideCheck class="app-icon" aria-hidden="true" focusable="false"></svg>
              <span>Import</span>
            </button>
            <button type="button" class="app-button app-button--secondary"
              (click)="display=false">
              <svg lucideX class="app-icon" aria-hidden="true" focusable="false"></svg>
              <span>Cancel</span>
            </button>
          </div>
      </ng-template>
</p-dialog>

<button type="button" (click)="showDialog()" class="app-button app-button--primary">
  <svg lucideCloudUpload class="app-icon" aria-hidden="true" focusable="false"></svg>
  <span>Import from URL</span>
</button>
