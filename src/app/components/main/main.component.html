<div>
  <app-dialog
    title="API definition could not be loaded"
    [(open)]="displayLoadFailureDialog"
    size="medium">
    <p>{{ loadFailureMessage }}</p>
    <div dialog-footer>
      <button
        type="button"
        class="app-button app-button--secondary"
      (click)="displayLoadFailureDialog = false">
        <svg lucideX class="app-icon" aria-hidden="true" focusable="false"></svg>
        <span>Close</span>
      </button>
    </div>
  </app-dialog>

  <div class="button-bar">
    <app-file-chooser></app-file-chooser>
    <app-url-chooser></app-url-chooser>
    <app-export></app-export>
  </div>
  <app-complexity-explanation-prototype></app-complexity-explanation-prototype>
  <div class="app-disclosure-list">
    @for (section of sections; track section.id) {
      <details
        class="app-disclosure"
        [open]="isSectionExpanded(section.id)">
        <summary
          class="app-disclosure__summary"
          [id]="section.headerId"
          [attr.aria-controls]="'main-panel-' + section.id"
          (click)="toggleSection(section.id, $event)">
          <span>{{ section.title }}</span>
          <svg
            lucideChevronDown
            class="accordion-toggle-icon"
            [class.is-expanded]="isSectionExpanded(section.id)"
            aria-hidden="true"
            focusable="false"></svg>
        </summary>
        <section
          class="app-disclosure__content"
          [id]="'main-panel-' + section.id"
          [attr.aria-labelledby]="section.headerId">
          <div class="app-disclosure__body">
            @if (section.id === '0') {
              <app-api-information></app-api-information>
            }
            @if (section.id === '1') {
              <app-summary></app-summary>
            }
            @if (section.id === '2') {
              <app-api-path-tree></app-api-path-tree>
            }
            @if (section.id === '3') {
              <app-api-tags></app-api-tags>
            }
            @if (section.id === '4') {
              <app-api-components-detail></app-api-components-detail>
            }
          </div>
        </section>
      </details>
    }
  </div>
</div>
