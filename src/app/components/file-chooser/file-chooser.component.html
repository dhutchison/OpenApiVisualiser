<input
  id="file-input"
  class="visually-hidden file-chooser-input"
  type="file"
  accept=".yaml,.yml,.json"
  multiple
  (change)="loadFile($event)">
<label class="app-button app-button--primary file-chooser-button" for="file-input">
  <svg lucideFileUp class="app-icon" aria-hidden="true" focusable="false"></svg>
  <span>Import File(s)</span>
</label>
