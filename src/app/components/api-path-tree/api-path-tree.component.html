<div class="api-path-tree-layout" #pathTreeLayout [style.min-height.px]="pathTreeMinHeight">
  <div class="path-tree-buttons">
    <p-selectButton
      [options]="viewTypes"
      [(ngModel)]="horizontalView"
      optionLabel="title"
      optionValue="value">
    </p-selectButton>

    <p-selectButton
      [options]="expansionTypes"
      [(ngModel)]="joinNodesWithNoLeaves"
      optionLabel="title"
      optionValue="value">
    </p-selectButton>

    <p-selectButton
      [options]="sortTypes"
      [(ngModel)]="sortOrder"
      optionLabel="title"
      optionValue="value">
    </p-selectButton>

    @if (tagFilterOptions.length) {
      <details class="path-tree-tag-filter" (toggle)="schedulePathTreeMeasurement()">
        <summary>
          <span class="pi pi-filter" aria-hidden="true"></span>
          <span>Tags</span>
          @if (selectedTagFilters.length) {
            <span class="count-pill">{{ selectedTagFilters.length }}</span>
          }
        </summary>
        <div class="path-tree-tag-filter__panel">
          @for (tag of tagFilterOptions; track tag) {
            <label>
              <input
                type="checkbox"
                [checked]="isTagSelected(tag.value)"
                (change)="toggleTagFilter(tag.value)">
              <span>{{ tag.label }}</span>
            </label>
          }
          <button
            pButton
            type="button"
            icon="pi pi-filter-slash"
            label="Clear"
            class="p-button-secondary"
            [disabled]="!selectedTagFilters.length"
            (click)="clearTagFilters()">
          </button>
        </div>
      </details>
    }

    @if (horizontalView) {
      <button pButton type="button" icon="pi pi-download" label="Download Image"
        (click)="downloadImage($event)"
        class="download-image-button"
        [disabled]="generatingImage">
      </button>
    }
  </div>

  <div>
    <div class="tree-view" #treeView>
      <p-tree [value]="apiPathNodes"
        (onNodeSelect)="openEndpointDetail($event)"
        [styleClass]="horizontalView? 'tree-horizontal': 'tree-vertical'">

        <ng-template let-node pTemplate="default">
          <button
            type="button"
            class="path-node"
            [attr.aria-expanded]="node.leaf ? null : node.expanded"
            [class.is-collapsed]="!node.leaf && !node.expanded"
            (click)="togglePathNode(node, $event)">
            @if (!node.leaf && !node.expanded) {
              <span
                class="path-node-toggle pi pi-chevron-right"
              aria-hidden="true"></span>
            }
            <span>{{ node.label }}</span>
          </button>
        </ng-template>

        <ng-template let-node pTemplate="operation">
          <button
            type="button"
            class="operation-node"
            pTooltip="{{ node.tooltip }}"
            [escape]=false
            id="{{ node.id }}-node"
          (click)="openEndpointDetail(node)">{{ node.label }}</button>
        </ng-template>
      </p-tree>
    </div>
  </div>
</div>

@if (endpointDialogVisible && selectedOperationNode) {
  <p-dialog
    header="{{ selectedOperationNode?.method }} {{ selectedOperationNode?.path }}"
    [(visible)]="endpointDialogVisible"
    [modal]="true"
    [draggable]="false"
    [resizable]="true"
    [style]="{width: '90vw'}"
    [contentStyle]="{'max-height': '80vh', overflow: 'auto'}">
    <ng-template pTemplate="content">
      <app-endpoint-swagger
        [apiSpec]="selectedOperationNode.apiDefinition"
        [path]="selectedOperationNode.path"
        [method]="selectedOperationNode.method"
        [operation]="selectedOperationNode.operation">
      </app-endpoint-swagger>
    </ng-template>
  </p-dialog>
}
