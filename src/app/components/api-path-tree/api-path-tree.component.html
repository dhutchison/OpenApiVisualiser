<div class="api-path-tree-layout" #pathTreeLayout [style.min-height.px]="pathTreeMinHeight">
  <div class="path-tree-buttons">
    <div class="segmented-control" role="group" aria-label="View orientation">
      <button type="button" class="segmented-control__option"
        [class.is-selected]="horizontalView"
        [attr.aria-pressed]="horizontalView"
        (click)="horizontalView = true">
        <svg lucideNetwork class="app-icon" aria-hidden="true" focusable="false"></svg>
        <span>Tree</span>
      </button>
      <button type="button" class="segmented-control__option"
        [class.is-selected]="!horizontalView"
        [attr.aria-pressed]="!horizontalView"
        (click)="horizontalView = false">
        <svg lucideList class="app-icon" aria-hidden="true" focusable="false"></svg>
        <span>List</span>
      </button>
    </div>

    <div class="segmented-control" role="group" aria-label="Path expansion">
      <button type="button" class="segmented-control__option"
        [class.is-selected]="joinNodesWithNoLeaves"
        [attr.aria-pressed]="joinNodesWithNoLeaves"
        (click)="joinNodesWithNoLeaves = true">
        <svg lucideMinimize2 class="app-icon" aria-hidden="true" focusable="false"></svg>
        <span>Compressed</span>
      </button>
      <button type="button" class="segmented-control__option"
        [class.is-selected]="!joinNodesWithNoLeaves"
        [attr.aria-pressed]="!joinNodesWithNoLeaves"
        (click)="joinNodesWithNoLeaves = false">
        <svg lucideMaximize2 class="app-icon" aria-hidden="true" focusable="false"></svg>
        <span>Expanded</span>
      </button>
    </div>

    <div class="segmented-control" role="group" aria-label="Path sorting">
      <button type="button" class="segmented-control__option"
        [class.is-selected]="sortOrder === 'default'"
        [attr.aria-pressed]="sortOrder === 'default'"
        (click)="sortOrder = 'default'">
        <svg lucideArrowDownUp class="app-icon" aria-hidden="true" focusable="false"></svg>
        <span>Default</span>
      </button>
      <button type="button" class="segmented-control__option"
        [class.is-selected]="sortOrder === 'asc'"
        [attr.aria-pressed]="sortOrder === 'asc'"
        (click)="sortOrder = 'asc'">
        <svg lucideArrowDownAZ class="app-icon" aria-hidden="true" focusable="false"></svg>
        <span>A-Z</span>
      </button>
      <button type="button" class="segmented-control__option"
        [class.is-selected]="sortOrder === 'desc'"
        [attr.aria-pressed]="sortOrder === 'desc'"
        (click)="sortOrder = 'desc'">
        <svg lucideArrowUpAZ class="app-icon" aria-hidden="true" focusable="false"></svg>
        <span>Z-A</span>
      </button>
    </div>

    @if (tagFilterOptions.length) {
      <details class="path-tree-tag-filter" (toggle)="schedulePathTreeMeasurement()">
        <summary>
          <svg lucideFunnel class="app-icon" aria-hidden="true" focusable="false"></svg>
          <span>Tags</span>
          @if (selectedTagFilters.length) {
            <span class="count-pill">{{ selectedTagFilters.length }}</span>
          }
        </summary>
        <div class="path-tree-tag-filter__panel">
          @for (tag of tagFilterOptions; track tag) {
            <label>
              <input
                type="checkbox"
                [checked]="isTagSelected(tag.value)"
                (change)="toggleTagFilter(tag.value)">
              <span>{{ tag.label }}</span>
            </label>
          }
          <button
            type="button"
            class="app-button app-button--secondary"
            [disabled]="!selectedTagFilters.length"
            (click)="clearTagFilters()">
            <svg lucideFilterX class="app-icon" aria-hidden="true" focusable="false"></svg>
            <span>Clear</span>
          </button>
        </div>
      </details>
    }

    @if (horizontalView) {
      <button class="app-button app-button--primary download-image-button" type="button"
        (click)="downloadImage()"
        [disabled]="generatingImage">
        <svg lucideDownload class="app-icon" aria-hidden="true" focusable="false"></svg>
        <span>Download Image</span>
      </button>
    }
  </div>

  <div>
    <div class="tree-view" #treeView>
      <p-tree [value]="apiPathRenderNodes"
        (onNodeSelect)="openEndpointDetail($event.node?.data)"
        [class]="horizontalView? 'tree-horizontal': 'tree-vertical'">

        <ng-template #node let-node>
          @if (node.type === 'operation') {
            <button
              type="button"
              class="operation-node"
              pTooltip="{{ node.tooltip }}"
              [escape]=false
              id="{{ node.id }}-node"
              (click)="openEndpointDetail(node.data)">{{ node.label }}</button>
          } @else {
            <button
              type="button"
              class="path-node"
              [attr.aria-expanded]="node.leaf ? null : node.expanded"
              [class.is-collapsed]="!node.leaf && !node.expanded"
              (click)="togglePathNode(node.data, $event)">
              @if (!node.leaf && !node.expanded) {
                <span class="path-node-toggle" aria-hidden="true">
                  <svg lucideChevronRight class="app-icon" aria-hidden="true" focusable="false"></svg>
                </span>
              }
              <span>{{ node.label }}</span>
            </button>
          }
        </ng-template>
      </p-tree>
    </div>
  </div>
</div>

@if (endpointDialogVisible && selectedOperationNode) {
  <p-dialog
    header="{{ selectedOperationNode?.method }} {{ selectedOperationNode?.path }}"
    [(visible)]="endpointDialogVisible"
    [modal]="true"
    [draggable]="false"
    [resizable]="true"
    [style]="{width: '90vw'}"
    [contentStyle]="{'max-height': '80vh', overflow: 'auto'}">
    <ng-template #content>
      <app-endpoint-swagger
        [apiSpec]="selectedOperationNode.apiDefinition"
        [path]="selectedOperationNode.path"
        [method]="selectedOperationNode.method"
        [operation]="selectedOperationNode.operation">
      </app-endpoint-swagger>
    </ng-template>
  </p-dialog>
}
