<app-dialog title="Export" [(open)]="display" size="small">
  <select [(ngModel)]="exportFormat">
    @for (format of exportFormats; track format.id) {
      <option [value]="format.id">
        {{ format.description }}
      </option>
    }
  </select>
  <div dialog-footer>
    <button type="submit" class="app-button app-button--primary" (click)="export()">
      <svg lucideCheck class="app-icon" aria-hidden="true" focusable="false"></svg>
      <span>Export</span>
    </button>
    <button type="button" class="app-button app-button--secondary" (click)="display=false">
      <svg lucideX class="app-icon" aria-hidden="true" focusable="false"></svg>
      <span>Cancel</span>
    </button>
  </div>
</app-dialog>

<button type="button" class="app-button app-button--primary"
  (click)="showDialog()"
  [disabled]="!buttonEnabled">
  <svg lucideDownload class="app-icon" aria-hidden="true" focusable="false"></svg>
  <span>Export</span>
</button>
