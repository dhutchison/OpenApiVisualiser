<p-treetable [value]="treeModel">
  <ng-template #header>
    <tr>
      <th class="ui-p-1">Name</th>
      <th class="ui-p-1">Type</th>
      <th class="ui-p-4">Description</th>
      <!--
      <th>Node</th>
      <th>Data</th>
      -->
    </tr>
  </ng-template>
  <ng-template #body let-rowNode let-rowData="rowData">

    <tr [ttRow]="rowNode">
      <td>
        @if (!rowNode.node.leaf) {
          <p-treetable-toggler [rowNode]="rowNode"></p-treetable-toggler>
        }
        {{rowNode.node.label}}
        @if (schema.required && schema.required.includes(rowNode.node.label)) {
          <strong class="required"> *</strong>
        }
      </td>
      <td>
        {{rowData.type}}
        @if (rowData.format) {
          <em>{{rowData.format}}</em>
        }
        @if (rowData.$ref) {
          <em><a href="{{rowData.$ref | replaceSlash }}">{{rowData.$ref}}</a></em>
        }
      </td>
      <td>
        <div [innerHTML]="(rowData.description | markdownify)"></div>
      </td>
      <!--
      <td>
        <ul>
          <li *ngFor="let item of rowNode.node | keyvalue">
            Key: <b>{{item.key}}</b> and Value: <b>{{item.value}}</b>
          </li>
        </ul>
      </td>
      <td>
        <ul>
          <li *ngFor="let item of rowData | keyvalue">
            Key: <b>{{item.key}}</b> and Value: <b>{{item.value}}</b>
          </li>
        </ul>
      </td>
      -->
    </tr>
  </ng-template>
</p-treetable>
