<dialog
  #dialog
  class="app-dialog"
  [class.app-dialog--small]="size === 'small'"
  [class.app-dialog--medium]="size === 'medium'"
  [class.app-dialog--large]="size === 'large'"
  [attr.aria-labelledby]="titleId"
  [attr.aria-describedby]="description ? descriptionId : null"
  (cancel)="handleCancel($event)"
  (close)="handleNativeClose()">
  <div class="app-dialog__surface">
    <header class="app-dialog__header">
      <h2 [id]="titleId">{{ title }}</h2>
      <button
        #closeButton
        type="button"
        class="app-dialog__close app-button app-button--secondary"
        data-dialog-close
        aria-label="Close dialog"
        (click)="closeDialog()">
        <svg lucideX class="app-icon" aria-hidden="true" focusable="false"></svg>
      </button>
    </header>

    @if (description) {
      <p class="app-dialog__description" [id]="descriptionId">{{ description }}</p>
    }

    <div class="app-dialog__content">
      <ng-content></ng-content>
    </div>

    <footer class="app-dialog__footer">
      <ng-content select="[dialog-footer]"></ng-content>
    </footer>
  </div>
</dialog>
